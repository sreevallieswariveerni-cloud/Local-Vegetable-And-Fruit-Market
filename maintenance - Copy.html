<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance | Green Grove</title>
    <link rel="icon" type="images/png" sizes="184x184" href="images/logo.png">


    <link rel="stylesheet" href="maintenance.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <div class="page-controls">
    <button id="rtl-btn" class="rtl-btn">RTL</button>

    <button id="theme-btn">
        <i data-lucide="moon"></i>
    </button>
</div>

<div class="maintenance-container">

    <div class="icon">
        <i class="fa-solid fa-screwdriver-wrench"></i>
    </div>

    <h1>Website Under Maintenance</h1>

    <p>
        We're currently performing scheduled maintenance
        to improve your shopping experience.
        We'll be back online shortly.
    </p>

    <div class="status">
        <i class="fa-solid fa-circle-check"></i>
        Thank you for your patience.
    </div>

    <div class="buttons">

        <a href="index.html" class="home-btn">
            <i class="fa-solid fa-house"></i>
            Back to Home
        </a>

        <a href="contact.html" class="contact-btn">
            <i class="fa-solid fa-headset"></i>
            Contact Support
        </a>

    </div>

</div>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
    lucide.createIcons();
</script>
<script>
const themeBtn=document.getElementById("theme-btn");
function updateTheme(){
    if(document.body.classList.contains("dark")){
        themeBtn.innerHTML='<i data-lucide="sun"></i>';
    }else{
        themeBtn.innerHTML='<i data-lucide="moon"></i>';

    }
    lucide.createIcons();
}
if(localStorage.getItem("theme")=="dark"){
    document.body.classList.add("dark");
}
updateTheme();
themeBtn.addEventListener("click",function(){
    document.body.classList.toggle("dark");
    localStorage.setItem(
        "theme",
        document.body.classList.contains("dark")
        ?"dark":"light"
    );
    updateTheme();
});
</script>
<script src="script.js"></script>
</body>
</html>

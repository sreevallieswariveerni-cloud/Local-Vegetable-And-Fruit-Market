<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Grove | My Cart</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f8f3;
    color:#333;
}

/* HEADER */

.cart-header{
    background:white;
    padding:25px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.cart-header h1{
    color:#2e8b57;
    font-size:34px;
}

.continue-btn{
    background:#2e8b57;
    color:white;
    padding:12px 25px;
    border-radius:10px;
    text-decoration:none;
    transition:.3s;
}

.continue-btn:hover{
    background:#256d46;
}

/* MAIN */

.cart-container{
    width:90%;
    max-width:1300px;
    margin:40px auto;
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:35px;
}

/* ITEMS */

#cart-items{
    display:flex;
    flex-direction:column;
    gap:25px;
}

.cart-card{
    display:flex;
    align-items:center;
    gap:25px;
    background:#fff;
    padding:22px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    transition:.3s;
}

.cart-card:hover{
    transform:translateY(-5px);
}

.cart-card img{
    width:130px;
    height:130px;
    object-fit:cover;
    border-radius:18px;
}

.cart-info{
    flex:1;
}

.cart-info h2{
    margin-bottom:10px;
    color:#2e8b57;
}

.cart-info p{
    margin:8px 0;
    color:#666;
}

/* PRICE */

.price-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
}

.price{
    font-size:24px;
    color:#2e8b57;
    font-weight:bold;
}

/* QTY */

.qty-box{
    display:flex;
    align-items:center;
    border:1px solid #ddd;
    border-radius:10px;
    overflow:hidden;
}

.qty-box button{
    width:40px;
    height:40px;
    border:none;
    background:#2e8b57;
    color:white;
    cursor:pointer;
    font-size:18px;
}

.qty-box span{
    padding:0 18px;
    font-weight:bold;
}

/* REMOVE */

.delete-btn{
    background:#ffeaea;
    color:red;
    border:none;
    width:50px;
    height:50px;
    border-radius:50%;
    cursor:pointer;
    font-size:22px;
}

/* SUMMARY */

.summary{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    height:fit-content;
    position:sticky;
    top:20px;
}

.summary h2{
    color:#2e8b57;
    margin-bottom:20px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    margin:15px 0;
}

.total{
    font-size:24px;
    color:#2e8b57;
    font-weight:bold;
    border-top:1px solid #ddd;
    padding-top:20px;
}

.checkout-btn{
    width:100%;
    margin-top:25px;
    background:#2e8b57;
    color:white;
    border:none;
    padding:15px;
    border-radius:10px;
    font-size:17px;
    cursor:pointer;
}

.checkout-btn:hover{
    background:#256d46;
}

/* OFFER */

.offer{
    margin-top:25px;
    background:#eaf8ef;
    padding:15px;
    border-radius:10px;
    color:#2e8b57;
    text-align:center;
}

/* RESPONSIVE */

@media(max-width:900px){

.cart-container{
grid-template-columns:1fr;
}

.cart-card{
flex-direction:column;
text-align:center;
}

.price-row{
flex-direction:column;
gap:15px;
}

.summary{
position:static;
}

}

</style>
</head>

<body>
    

<header class="cart-header">

<h1>🛒 My Cart</h1>

<a href="shop.html" class="continue-btn">
Continue Shopping
</a>

</header>

<div class="cart-container">

<div id="cart-items">

<!-- JS inserts cart items here -->

</div>

<div class="summary">

<h2>Order Summary</h2>

<div class="summary-row">
<span>Subtotal</span>
<span id="subtotal">₹0</span>
</div>

<div class="summary-row">
<span>Delivery</span>
<span>FREE</span>
</div>

<div class="summary-row total">
<span>Total</span>
<span id="total">₹0</span>
</div>

<button class="checkout-btn">
Proceed To Checkout
</button>

<div class="offer">
🌿 Congratulations! You have Free Delivery.
</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
